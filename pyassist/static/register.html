<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — PyAssist</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    // Prevent theme flash
    const savedTheme = localStorage.getItem("pyassist_theme");
    const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", savedTheme || (prefersDark ? "dark" : "light"));
  </script>
</head>
<body class="auth-page">
  <div class="auth-card">
    <div style="display: flex; justify-content: flex-end; margin-bottom: -20px;">
      <button id="btn-theme-toggle" class="icon-btn" title="Toggle Theme" aria-label="Toggle Theme">☀️</button>
    </div>

    <div class="auth-header">
      <div class="auth-logo">🐍</div>
      <h1 class="auth-title">Create an Account</h1>
      <p class="auth-subtitle">Join PyAssist to ask questions & save your Python chat history</p>
    </div>

    <div id="auth-error" class="error-banner" style="display: none;"></div>

    <form id="register-form" class="auth-form">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input 
          type="text" 
          id="username" 
          class="form-input" 
          placeholder="e.g. python_dev" 
          required 
          autocomplete="username"
          minlength="3"
          maxlength="30"
          autofocus
        >
        <span class="form-hint">3–30 characters, letters, numbers, and underscores only.</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          class="form-input" 
          placeholder="developer@example.com" 
          required 
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          class="form-input" 
          placeholder="At least 8 characters" 
          required 
          autocomplete="new-password"
          minlength="8"
        >
        <span class="form-hint">Must include letters and at least one number.</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm-password">Confirm Password</label>
        <input 
          type="password" 
          id="confirm-password" 
          class="form-input" 
          placeholder="Repeat password" 
          required 
          autocomplete="new-password"
          minlength="8"
        >
      </div>

      <button type="submit" id="btn-submit" class="btn-primary">
        Create Account
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login.html" class="auth-link">Sign In</a>
    </div>
  </div>

  <script src="/js/api-errors.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
