<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — PyAssist</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    // Prevent theme flash
    const savedTheme = localStorage.getItem("pyassist_theme");
    const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", savedTheme || (prefersDark ? "dark" : "light"));
  </script>
</head>
<body class="auth-page">
  <div class="auth-card">
    <div style="display: flex; justify-content: flex-end; margin-bottom: -20px;">
      <button id="btn-theme-toggle" class="icon-btn" title="Toggle Theme" aria-label="Toggle Theme">☀️</button>
    </div>

    <div class="auth-header">
      <div class="auth-logo">🐍</div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your PyAssist account to continue</p>
    </div>

    <div id="auth-error" class="error-banner" style="display: none;"></div>

    <form id="login-form" class="auth-form">
      <div class="form-group">
        <label class="form-label" for="username-or-email">Username or Email</label>
        <input 
          type="text" 
          id="username-or-email" 
          class="form-input" 
          placeholder="e.g. dev_coder or coder@example.com" 
          required 
          autocomplete="username"
          autofocus
        >
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label class="form-label" for="password">Password</label>
        </div>
        <input 
          type="password" 
          id="password" 
          class="form-input" 
          placeholder="••••••••" 
          required 
          autocomplete="current-password"
        >
      </div>

      <button type="submit" id="btn-submit" class="btn-primary">
        Sign In
      </button>

      <button type="button" id="btn-fill-demo" class="btn-secondary" style="width: 100%; margin-top: 8px; font-size: 13px;">
        ⚡ Fill Demo Credentials (demo_user)
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account yet? <a href="/register.html" class="auth-link">Create one</a>
    </div>
  </div>

  <script src="/js/api-errors.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
